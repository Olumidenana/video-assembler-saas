services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: auracut-video-assembler:latest
    container_name: auracut-video-assembler
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env.local
