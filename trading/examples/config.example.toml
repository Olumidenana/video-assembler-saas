# ICT Time-and-Price configuration. Every value below is a rule to confirm
# with the trader (see RULES.md). Times are New York local time.
initial_equity = 10000.0

[instrument]
symbol = "EURUSD"
pip_size = 0.0001
spread_pips = 0.8
contract_size = 100000
commission_per_lot = 7.0
quote_to_account_rate = 1.0
volume_step = 0.01
min_lots = 0.01
# news_currencies = ["USD"]   # required for non-FX symbols such as XAUUSD or NAS100

[strategy]
timeframe_minutes = 5
day_rollover = "17:00"
killzones = [
  { name = "london",   start = "02:00", end = "05:00" },
  { name = "new_york", start = "07:00", end = "10:00" },
]
reference_ranges = [
  { name = "asia", start = "20:00", end = "00:00" },
]
use_prior_day_levels = true
invalidate_levels_taken_outside_killzone = true
min_sweep_pips = 0.5
max_confirm_bars = 3
stop_buffer_pips = 1.0
min_stop_pips = 3.0
max_stop_pips = 25.0
target_mode = "opposite_level"   # or "rr"
target_rr = 2.0
min_rr = 1.5
max_signals_per_day = 1
flatten_time = "16:00"

[risk]
risk_per_trade_pct = 0.5
max_daily_loss_pct = 2.0
max_weekly_loss_pct = 4.0
max_consecutive_losses = 3
max_trades_per_day = 2
max_open_positions = 1
max_lots = 5.0

[news]
enabled = true
impacts = ["high"]
minutes_before = 30
minutes_after = 30
flatten_minutes_before = 5

[live]
server_timezone = "NY+7"
poll_seconds = 5
magic = 20260901
deviation_points = 10
max_signal_age_seconds = 120
kill_switch_file = "STOP"
journal_path = "journal.sqlite"
